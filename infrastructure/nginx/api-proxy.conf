# Install under /etc/nginx/conf.d/ on the API host. This file is included in
# nginx's http context by the standard distribution configuration.
# The backend is bound to 127.0.0.1:8080 as documented in AWS_DEPLOYMENT.md.

map $http_upgrade $devsync_connection_upgrade {
    default upgrade;
    ''      close;
}

log_format devsync_no_query '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_user_agent"';

server {
    listen 80;
    server_name devsync-api.sytes.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name devsync-api.sytes.net;

    # Point these paths at the certificate provisioned for the API hostname.
    ssl_certificate     /etc/letsencrypt/live/devsync-api.sytes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devsync-api.sytes.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/devsync-api.access.log devsync_no_query;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $devsync_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
